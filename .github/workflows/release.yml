name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: .exe
          - os: windows-latest
            rid: win-arm64
            ext: .exe
          - os: ubuntu-latest
            rid: linux-x64
            ext: ''
          - os: ubuntu-latest
            rid: linux-arm64
            ext: ''
          - os: macos-latest
            rid: osx-x64
            ext: ''
          - os: macos-latest
            rid: osx-arm64
            ext: ''

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.rid }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: |
          dotnet publish VPNCheck.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o publish/${{ matrix.rid }}
        shell: bash

      - name: Package
        run: |
          cd publish/${{ matrix.rid }}
          BINARY="VPNCheck${{ matrix.ext }}"
          ZIP="VPNCheck-${{ matrix.rid }}.zip"
          cp ../../sources.txt .
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -Command "Compress-Archive -Path '$BINARY','sources.txt' -DestinationPath '$ZIP'"
          else
            zip "$ZIP" "$BINARY" sources.txt
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPNCheck-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/VPNCheck-${{ matrix.rid }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
